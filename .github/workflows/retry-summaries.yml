name: Retry Summaries

on:
  schedule:
    # Every 4 hours at :00 (UTC) = 09:00, 13:00, 17:00, 21:00, 01:00, 05:00 JST
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/ingest/go.mod
          cache-dependency-path: cmd/ingest/go.sum

      - name: Build
        run: |
          cd cmd/ingest
          go build -o ../../ingest .

      - name: Retry summaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MIN_INTERVAL_MS: ${{ vars.GEMINI_MIN_INTERVAL_MS }}
          GEMINI_COOLDOWN_MS: ${{ vars.GEMINI_COOLDOWN_MS }}
          RETRY_DAYS: ${{ vars.RETRY_DAYS }}
          RETRY_MAX_ITEMS: ${{ vars.RETRY_MAX_ITEMS }}
        run: ./ingest --retry
