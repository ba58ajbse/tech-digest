name: Retry Summaries

on:
  schedule:
    # Every 4 hours at :00 (UTC) = 09:00, 13:00, 17:00, 21:00, 01:00, 05:00 JST
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cmd/ingest/go.mod
          cache-dependency-path: cmd/ingest/go.sum

      - name: Build
        run: |
          cd cmd/ingest
          go build -o ../../ingest .

      - name: Retry summaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MIN_INTERVAL_MS: ${{ vars.GEMINI_MIN_INTERVAL_MS }}
          GEMINI_COOLDOWN_MS: ${{ vars.GEMINI_COOLDOWN_MS }}
          RETRY_DAYS: ${{ vars.RETRY_DAYS }}
          RETRY_MAX_ITEMS: ${{ vars.RETRY_MAX_ITEMS }}
        run: ./ingest --retry
